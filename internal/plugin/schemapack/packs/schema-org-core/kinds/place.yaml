name: extension:schema_org:place
displayName: Place (schema.org)
description: A physical or geopolitical location as defined by schema.org.
extends: place
sameAs:
  - https://schema.org/Place
propertySchema:
  type: object
  properties:
    address:
      type: string
      description: The mailing address of the place.
    latitude:
      type: number
      description: WGS84 latitude in decimal degrees.
    longitude:
      type: number
      description: WGS84 longitude in decimal degrees.
