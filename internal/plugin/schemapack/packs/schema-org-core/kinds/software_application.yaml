name: extension:schema_org:softwareapplication
displayName: Software Application (schema.org)
description: A software application as defined by schema.org.
extends: document
sameAs:
  - https://schema.org/SoftwareApplication
propertySchema:
  type: object
  properties:
    softwareVersion:
      type: string
      description: Version of the software instance.
    operatingSystem:
      type: string
      description: Target operating system (e.g. macOS, Linux).
    applicationCategory:
      type: string
      description: Type of software application (e.g. GameApplication, FinanceApplication).
