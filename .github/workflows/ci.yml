name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "agent-docs/**"
      - ".claude/skills/**"
      - ".claude/agents/**"
      - ".claude/memos/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "agent-docs/**"
      - ".claude/skills/**"
      - ".claude/agents/**"
      - ".claude/memos/**"

permissions:
  contents: read

jobs:
  ci:
    name: lint + test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is a primary CGO target (the binary links liblbug); test+build
        # natively on both so the macOS/CGO path is covered, not just ubuntu.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Setup
        run: mise run setup

      - name: CI gate
        run: mise run ci

      # Coverage is platform-agnostic; generate + upload once (ubuntu) to avoid
      # double-counting and a redundant Codecov upload.
      - name: Generate coverage profile
        if: matrix.os == 'ubuntu-latest'
        run: mise run coverage:ci

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: go
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
