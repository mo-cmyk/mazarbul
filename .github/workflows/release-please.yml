name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build + attach the portable archives when release-please cuts a release.
  # DORMANT by default: only runs when the ENABLE_RELEASE_BUILD repo variable is
  # set to 'true' (flipped on by the public-distribution activation issue).
  release-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.ENABLE_RELEASE_BUILD == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: true
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Regenerate the Homebrew formula from the published checksums and push it to
  # the tap, so `brew upgrade maz` picks up every release without hand edits.
  # Auth: a write deploy key on mo-cmyk/homebrew-mazarbul, stored here as the
  # HOMEBREW_TAP_DEPLOY_KEY secret (GITHUB_TOKEN cannot push to another repo).
  homebrew:
    needs: [release-please, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: mo-cmyk/homebrew-mazarbul
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Render and push formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -D /tmp/rel
          ./scripts/homebrew-formula.sh "$TAG" /tmp/rel/checksums.txt > tap/Formula/maz.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/maz.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "maz ${TAG#v}"
          git push

  # Publish the release to the official MCP Registry (registry.modelcontextprotocol.io)
  # as io.github.mo-cmyk/mazarbul, pointing at the per-platform .mcpb bundles
  # release-build attached. Aggregators (PulseMCP and others) sync from there.
  # Auth: GitHub Actions OIDC (id-token: write); the registry grants the
  # io.github.<repo owner>/* namespace from the token, so no secret is needed.
  # A registry version is immutable: re-running this job for an already
  # published tag fails with a duplicate-version error, which is harmless.
  mcp-registry:
    needs: [release-please, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Bump deliberately; the archive is Sigstore-verified against this tag.
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Render server.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -D /tmp/rel
          ./scripts/mcp-server-json.sh "$TAG" /tmp/rel/checksums.txt > /tmp/server.json
          cat /tmp/server.json
          ./mcp-publisher validate /tmp/server.json

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish /tmp/server.json
