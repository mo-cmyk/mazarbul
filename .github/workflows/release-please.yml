name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build + attach the portable archives when release-please cuts a release.
  # DORMANT by default: only runs when the ENABLE_RELEASE_BUILD repo variable is
  # set to 'true' (flipped on by the public-distribution activation issue).
  release-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.ENABLE_RELEASE_BUILD == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: true
      tag: ${{ needs.release-please.outputs.tag_name }}
